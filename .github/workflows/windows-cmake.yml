name: Windows (CMake)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "trunk" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: x64
            triplet: x64-windows
            generator: "Ninja Multi-Config"
          - name: Windows x86
            os: windows-latest
            platform: Win32
            triplet: x86-windows
            generator: "Ninja Multi-Config"

    runs-on: ${{ matrix.os }}

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
              core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
              core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: vcpkg install --triplet ${{ matrix.triplet }} apr apr-util zlib openssl brotli

      - uses: actions/checkout@v3

      - name: Prepare Environment (Windows)
        if: runner.os == 'Windows'
        run: |
          $root = "C:\Program Files\Microsoft Visual Studio\2022\Enterprise"
          Import-Module "$root\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $root -DevCmdArguments "-arch=${{ matrix.arch }}"

          ls env: | foreach { "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV }

      - name: Configure CMake
        run: >
            cmake
            -B ${{github.workspace}}/build
            -G "${{ matrix.generator }}"
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            -DCMAKE_PREFIX_PATH=C:/vcpkg/installed/${{ matrix.triplet }}
            -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install

      - name: Build (Release)
        run: cmake --build ${{github.workspace}}/build --config Release -j

      - name: Build (Debug)
        run: cmake --build ${{github.workspace}}/build --config Debug -j

      - name: Test (Release)
        working-directory: ${{github.workspace}}/build
        run: ctest -C Release --output-on-failure

      - name: Test (Debug)
        working-directory: ${{github.workspace}}/build
        run: ctest -C Debug --output-on-failure
