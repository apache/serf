name: Windows (CMake)

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "trunk" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            platform: x64
            triplet: x64-windows
            generator: "Visual Studio 17 2022"
          - name: Windows x86
            os: windows-latest
            platform: Win32
            triplet: x86-windows
            generator: "Visual Studio 17 2022"

    runs-on: ${{ matrix.os }}

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
              core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
              core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: vcpkg install --triplet ${{ matrix.triplet }} apr apr-util zlib openssl brotli

      - uses: actions/checkout@v3

      - name: Configure CMake
        run: >
            cmake
            -B ${{github.workspace}}/build
            -G "${{ matrix.generator }}"
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            -DCMAKE_INSTALL_PREFIX=${{github.workspace}}/install
            -DCMAKE_GENERATOR_PLATFORM=${{ matrix.platform }}
            -DAPR_ROOT=C:/vcpkg/installed/${{ matrix.triplet }}
            -DAPRUtil_ROOT=C:/vcpkg/installed/${{ matrix.triplet }}
            -DOPENSSL_ROOT_DIR=C:/vcpkg/installed/${{ matrix.triplet }}
            -DZLIB_ROOT=C:/vcpkg/installed/${{ matrix.triplet }}
            -DBrotli_ROOT=C:/vcpkg/installed/${{ matrix.triplet }}

      - name: Build (Release)
        run: cmake --build ${{github.workspace}}/build --config Release -j

      - name: Build (Debug)
        run: cmake --build ${{github.workspace}}/build --config Debug -j

      - name: Test (Release)
        working-directory: ${{github.workspace}}/build
        run: ctest -C Release --output-on-failure

      - name: Test (Debug)
        working-directory: ${{github.workspace}}/build
        run: ctest -C Debug --output-on-failure
